services:
  mysql:
    image: mysql:8.1
    environment:
      MYSQL_DATABASE: dev
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3306:3306
      - 33060:33060

  mongo:
    image: mongo
    ports:
      - 27017:27017
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: redis-server

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: dev
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
